# Construit et publie l'image du cours sur ghcr.io à chaque modification de l'environnement.
# Image produite : ghcr.io/<proprietaire>/edm-base:latest (Intel/AMD + ARM/Apple Silicon)
name: Image Docker

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - requirements.txt
      - .github/workflows/image-docker.yml
  workflow_dispatch:   # bouton "Run workflow" dans l'onglet Actions

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/edm-base:latest
